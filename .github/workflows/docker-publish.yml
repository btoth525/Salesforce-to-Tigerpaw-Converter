name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - 'claude/beta-improvements-*'
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          docker build -t "${IMAGE}:${BRANCH_TAG}" .
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${BRANCH_TAG}" >> $GITHUB_ENV

      - name: Debug GHCR auth
        run: |
          echo "Testing GHCR token access..."
          curl -sI -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/" | head -5
          echo "Token permissions in this job:"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" | python3 -c "import json,sys; d=json.load(sys.stdin); print('private:', d.get('private'))" 2>/dev/null || true

      - name: Push Docker image
        run: |
          docker push "${IMAGE}:${BRANCH_TAG}"
          # Also tag as beta for claude/ branches
          if [[ "${{ github.ref }}" == refs/heads/claude/* ]]; then
            docker tag "${IMAGE}:${BRANCH_TAG}" "${IMAGE}:beta"
            docker push "${IMAGE}:beta"
          fi
          # Also tag as latest for main branch
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            docker tag "${IMAGE}:${BRANCH_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
